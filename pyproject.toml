[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab-lab6"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124,<1",
  "uvicorn>=0.38,<1",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

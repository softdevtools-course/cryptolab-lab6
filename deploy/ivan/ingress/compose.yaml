name: course-ingress
services:
  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lab06_edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  lab06_edge:
    external: true
volumes:
  caddy_data:
  caddy_config:
